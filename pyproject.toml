[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sherpai-schemas"
version = "0.1.0"
description = "Shared schema definitions for SherpAI"
requires-python = ">=3.12"

dependencies = [
    "pandas==3.0.1",
    "requests==2.33.1",
    "pymilvus==2.6.11",
    "pydantic>=2.13.4",
]

[tool.hatch.build.targets.wheel]
packages = ["sherpai_schemas"]

# Dev-only (PEP 735). Installed by `uv sync`, never part of the built wheel,
# so `pip install git+...` in the Docker images stays runtime-deps only.
[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "known_bug: asserts the behavior the code SHOULD have. Fails until the underlying bug is fixed; each one names the fix in its docstring. Run `-m 'not known_bug'` to see only regressions.",
]
